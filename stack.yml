version: "3.8"

x-claude-base: &claude-base
  image: lumir/claude:latest
  networks:
    - default
  deploy:
    replicas: 1
    restart_policy:
      condition: any

services:
  alice:
    <<: *claude-base
    hostname: alice
    environment:
      SSH_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI...replace-with-alice-key... alice"
    ports:
      - target: 22
        published: 2201
        protocol: tcp
        mode: host
    volumes:
      - alice:/home/claude

  bob:
    <<: *claude-base
    hostname: bob
    environment:
      SSH_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI...replace-with-bob-key... bob"
    ports:
      - target: 22
        published: 2202
        protocol: tcp
        mode: host
    volumes:
      - bob:/home/claude

volumes:
  alice:
  bob:

networks:
  default:
    driver: overlay
